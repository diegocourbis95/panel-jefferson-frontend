<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Panel Jefferson — En pausa</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }
  .card {
    max-width: 420px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #94a3b8;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 24px;
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; color: #f1f5f9; }
  p { font-size: 15px; color: #cbd5e1; }
  p + p { margin-top: 10px; }
  .muted { font-size: 13px; color: #64748b; margin-top: 28px; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Panel Jefferson</span>
    <h1>Aplicación en pausa</h1>
    <p>El panel está temporalmente fuera de servicio.</p>
    <p>Para cualquier consulta, contacta a Diego.</p>
    <p class="muted">Los datos están guardados y disponibles. El servicio volverá a activarse más adelante.</p>
  </div>
</body>
</html>
